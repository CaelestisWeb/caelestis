<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Caelestis, publicité 4, tout réunir</title>
<link rel="stylesheet" href="pub.css">
<style>
  .p4 { background: var(--vert-profond); }
  .p4 h1 { font-size: 62px; }

  .p4 .schema { position: absolute; top: 620px; left: 74px; right: 74px; z-index: 5; }
  .p4 .schema svg { display: block; width: 100%; height: auto; }
  .p4 .etiq { fill: none; stroke: rgba(184, 196, 187, .55); stroke-width: 1.2; }
  .p4 .etiq-t { font-family: 'Satoshi'; font-size: 19px; font-weight: 500; fill: var(--sauge); }
  .p4 .lien { fill: none; stroke: rgba(184, 196, 187, .45); stroke-width: 1.3; }
  .p4 .coeur { fill: var(--creme); }
  .p4 .coeur-t { font-family: 'Satoshi'; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; fill: var(--vert); }
</style>
</head>
<body>
<div class="affiche pub sur-vert p4">

  <div class="entete">
    <img src="../assets/wordmark-creme.svg" alt="Caelestis">
    <span class="lieu">caelestis.fr</span>
  </div>
  <div class="filet"></div>

  <div class="bloc-texte">
    <p class="eyebrow">Votre visibilité, rassemblée</p>
    <h1>Vous avez déjà tout<br>ce qu'il faut. Il ne reste<br><span class="accent">plus qu'à le réunir.</span></h1>
  </div>

  <div class="schema">
    <svg viewBox="0 0 932 452" role="img" aria-label="Six canaux qui ramènent vers votre site">
      <path class="lien" d="M216 60 C 272 60, 282 226, 338 226"/>
      <path class="lien" d="M216 226 L 338 226"/>
      <path class="lien" d="M216 392 C 272 392, 282 226, 338 226"/>
      <path class="lien" d="M716 60 C 660 60, 650 226, 594 226"/>
      <path class="lien" d="M716 226 L 594 226"/>
      <path class="lien" d="M716 392 C 660 392, 650 226, 594 226"/>

      <rect class="etiq" x="0" y="32" width="216" height="56" rx="28"/>
      <text class="etiq-t" x="108" y="60" text-anchor="middle" dominant-baseline="central">Fiche Google</text>
      <rect class="etiq" x="0" y="198" width="216" height="56" rx="28"/>
      <text class="etiq-t" x="108" y="226" text-anchor="middle" dominant-baseline="central">Bouche à oreille</text>
      <rect class="etiq" x="0" y="364" width="216" height="56" rx="28"/>
      <text class="etiq-t" x="108" y="392" text-anchor="middle" dominant-baseline="central">Les marchés</text>

      <rect class="etiq" x="716" y="32" width="216" height="56" rx="28"/>
      <text class="etiq-t" x="824" y="60" text-anchor="middle" dominant-baseline="central">Instagram</text>
      <rect class="etiq" x="716" y="198" width="216" height="56" rx="28"/>
      <text class="etiq-t" x="824" y="226" text-anchor="middle" dominant-baseline="central">Facebook</text>
      <rect class="etiq" x="716" y="364" width="216" height="56" rx="28"/>
      <text class="etiq-t" x="824" y="392" text-anchor="middle" dominant-baseline="central">Presse locale</text>

      <rect class="coeur" x="338" y="176" width="256" height="100" rx="22"/>
      <text class="coeur-t" x="466" y="226" text-anchor="middle" dominant-baseline="central">Votre site</text>
    </svg>
  </div>

  <div class="cta">
    <span class="bouton">Parler de mon projet</span>
    <span class="note">caelestis.fr<br>Devis gratuit sous 48&nbsp;h</span>
  </div>

</div>
</body>
</html>
