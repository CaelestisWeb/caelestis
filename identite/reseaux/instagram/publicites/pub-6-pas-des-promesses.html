<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Caelestis, publicité 6, pas des promesses</title>
<link rel="stylesheet" href="pub.css">
<style>
  .p6 { background: var(--vert-profond); }
  .p6 h1 { font-size: 68px; }

  .p6 .fenetre {
    top: 654px; left: 288px; width: 792px;
    box-shadow: 0 46px 90px -26px rgba(0, 0, 0, .62), 0 0 0 1px rgba(252, 251, 248, .07);
  }
  .p6 .fenetre .cadre { height: 452px; overflow: hidden; }
  .p6 .fenetre .cadre img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; }

  .p6 .tel { left: 78px; top: 790px; width: 262px; box-shadow: 0 38px 70px -20px rgba(0, 0, 0, .66); }

  /* l'appel se cale à droite du téléphone, qui déborde par le bas */
  .p6 .cta { left: 400px; justify-content: flex-end; gap: 30px; }
  .p6 .cta .note { line-height: 1.45; }
</style>
</head>
<body>
<div class="affiche pub sur-vert p6">

  <div class="entete">
    <img src="../assets/wordmark-creme.svg" alt="Caelestis">
    <span class="lieu">Réalisations</span>
  </div>
  <div class="filet"></div>

  <div class="bloc-texte">
    <p class="eyebrow">Deux sites livrés, visitables</p>
    <h1>Des sites en ligne,<br><span class="accent">pas des promesses.</span></h1>
    <p class="sous">Allez les voir avant de nous confier le vôtre.</p>
  </div>

  <div class="fenetre">
    <div class="barre">
      <span class="pastille"></span><span class="pastille"></span><span class="pastille"></span>
      <span class="url">lacoquette-bycaro.fr</span>
    </div>
    <div class="cadre"><img src="../captures/client-la-coquette-desktop.png" alt="Site de La Coquette"></div>
  </div>

  <div class="tel">
    <img src="../captures/client-fee-des-ongles-mobile.png" alt="Site de Fée des Ongles sur téléphone">
  </div>

  <div class="cta">
    <span class="bouton">caelestis.fr</span>
    <span class="note">lacoquette-bycaro.fr<br>feedesongles.fr</span>
  </div>

</div>
</body>
</html>
